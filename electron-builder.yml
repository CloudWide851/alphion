appId: dev.alphion.workbench
productName: Alphion
artifactName: Alphion-${version}-${arch}.${ext}
asar: true
npmRebuild: false
asarUnpack:
  - node_modules/better-sqlite3/**
files:
  - dist/**
  - package.json
  - assets/**
directories:
  app: .desktop-runtime
  output: release/v0.8.0
  buildResources: assets
win:
  icon: alphion.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  installerIcon: alphion.ico
  uninstallerIcon: alphion.ico
  installerHeaderIcon: alphion.ico
  artifactName: Alphion-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Alphion
portable:
  artifactName: Alphion-${version}-${arch}-portable.${ext}
