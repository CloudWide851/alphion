appId: dev.alphion.workbench
productName: Alphion
artifactName: Alphion-${version}-${arch}.${ext}
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
files:
  - dist/**
  - package.json
  - alphion-icon.svg
directories:
  app: .desktop-runtime
  output: release
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: Alphion-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: Alphion-${version}-${arch}-portable.${ext}
